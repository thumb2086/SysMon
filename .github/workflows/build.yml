name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: sysmon-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: sysmon-windows.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: sysmon-macos

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build
      run: cargo build --release --target ${{ matrix.target }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: target/${{ matrix.target }}/release/sysmon*

  build-installer:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: sysmon-windows.exe

    - name: Setup NSIS
      uses: crazy-max/ghaction-setup-nsis@v4

    - name: Build Installer
      run: |
        Copy-Item "sysmon-windows.exe\sysmon.exe" -Destination "installer\"
        Copy-Item "config.toml" -Destination "installer\"
        & "C:\Program Files (x86)\NSIS\makensis.exe" "installer\installer.nsi"

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: sysmon-installer.exe
        path: installer\SysMon-Setup.exe

  release:
    needs: [build, build-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          sysmon-windows.exe/sysmon.exe
          sysmon-linux/sysmon
          sysmon-macos/sysmon
          sysmon-installer.exe/SysMon-Setup.exe
