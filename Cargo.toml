[package]
name = "sysmon"
version = "0.1.0"
edition = "2021"
authors = ["SysMon"]
description = "Lightweight system monitor with network traffic tracking"

[dependencies]
# GUI
eframe = "0.28"
egui = "0.28"
egui_extras = { version = "0.28", features = ["all"] }

# System monitoring
sysinfo = "0.31"

# GPU monitoring
[target.'cfg(windows)'.dependencies]
nvapi = "0.1"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# tray icon
tray-icon = "0.19"
winit = "0.30"

# Single instance
single-instance = "0.3"

# Notifications
notify-rust = "4"

# Time
chrono = "0.4"

# Windows API for auto-start
winreg = "0.52"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
